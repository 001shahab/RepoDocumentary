[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "repo-documentary"
dynamic = ["version"]
description = "Turn any git history into a narrated documentary: the founding, the great refactor, the 3 a.m. hotfix."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shahab Anbarjafari", email = "shb@3sholding.com" }]
maintainers = [{ name = "Shahab Anbarjafari", email = "shb@3sholding.com" }]
keywords = [
    "git",
    "cli",
    "llm",
    "openai",
    "storytelling",
    "developer-tools",
    "git-history",
    "documentary",
    "repository-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.66",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/001shahab/RepoDocumentary"
Repository = "https://github.com/001shahab/RepoDocumentary"
Issues = "https://github.com/001shahab/RepoDocumentary/issues"
Changelog = "https://github.com/001shahab/RepoDocumentary/blob/main/CHANGELOG.md"

[project.scripts]
repodoc = "repodoc.cli:main"

[tool.hatch.version]
path = "src/repodoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoc"]

[tool.hatch.build.targets.sdist]
include = ["src/repodoc", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/repodoc"]

[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["repodoc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
