name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full repodoc command you ran.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead (including any error message).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `repodoc --version`, `python --version` and `git --version`.
